name: intelligent_admissions
description: "Intelligent Admissions Assistant - A smart app to guide students through university admissions."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  # Add other Firebase services you need:
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
